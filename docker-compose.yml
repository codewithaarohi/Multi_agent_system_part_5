services:

  postgres:
    image: postgres:16
    container_name: langgraph-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langgraph_memory
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: multi-agent-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data: